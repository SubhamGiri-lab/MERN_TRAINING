<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .main{
            display: inline-block;
            position: absolute;
            left: 35%;
            top: 200px;
        }
        .parent{
            position: relative;
            height: 500px;
            width: 420px;
            background-color: antiquewhite;
            border-radius: 10px;
        }
        .heart{
            position: absolute;
            padding: 11px;
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            font-size: x-large;
            font-family: 'Courier New', Courier, monospace;
            border-radius: 50%;
            top:10px;
            left: 350px;
        }
        .sale{
            position: absolute;
            padding: 10px;
            background-color: brown;
            color: white;
            font-size: x-large;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 600;
            border-radius: 10%;
            top:10px;
            left:20px;
        }
        .about{
            padding: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: xx-large;
        }
        .price{
            padding: 10px;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            font-size: xx-large;
            color: brown;
            padding-bottom: 30px;
        }
        .button{
            padding: 10px;
            text-align: center;
        }
        .cart{
            text-decoration: none;
            background-color: black;
            color: aliceblue;
            padding: 20px 135px;
            border-radius: 10px;
            cursor: pointer;
            font-size: x-large;
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        body{
            position: relative;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="parent">
            <div class="sale">Sale</div>
            <div class="heart">🖤</div>
            <div class="img">
                <img src="https://www.asics.co.in/media/.renditions/wysiwyg/homepage/indoor_court.jpg?auto=webp&format=pjpg&quality=85" height="290px" width="100%" style="border-radius: 3%;">
            </div>
            <div class="about">
                <p>Running Shoes</p>
            </div>
            <div class="price">
                <p>$299</p>
            </div>
            <div class="button">
                <a class= "cart" href="#" class="but">
                    Add to Cart
                </a>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .outer{
            display: inline-block;
            position: absolute;
            left: 36%;
            top: 20%;
        }
        .main{
            text-align: center;
            width: 400px;
            height: 500px;
            background: greenyellow;
            border: 2px solid black;
        }
        .head_div{
            padding: 20px 20px;
            align-items: center;
        }
        .head_div h1{
            font-family: 'Courier New', Courier, monospace;
        }
        .img_div{
            padding: 20px;
        }
        .image{
            width: 150px;
            border-radius: 50%;
            border: 2px solid black;
            
        }
        .name{
            font-family: 'Courier New', Courier, monospace; font-size: x-large; font-weight: 600;
        }
        .about_div{
            padding: 20px; 
            font-family: 'Courier New', Courier, monospace;
        }
        .follow{
            height: 80px;
            width: 80px;
            border: 2px solid black;
            text-decoration: none;
            color: black;
            padding: 11px ;
            background-color: rgba(215, 235, 221, 0.459);
        }
        .follow_div{
            padding-top: 20px;
        }
    </style>
</head>
<body>
    <div class="outer">
        <div class="main">
            <div class="head_div">
                <h1>Profile Card</h1>
            </div>
            <hr style="border: none; border-top: 2px solid black">
            <div class="img_div">
                <img class="image" src="https://img.magnific.com/free-vector/8000-210_138676-7714.jpg?semt=ais_hybrid&w=740&q=80">
            </div>
            <div>
                <p class="name">Subham Giri</p>
            </div>
            <div class="about_div">
                <p>Btech(CSE) Student at parul University</p>
                <p>Frontend - Developer</p>
            </div>
            <div class="follow_div">
                <a class="follow" href="https://www.instagram.com/frosstt_noir/">Follow</a>
            </div>
        </div>
    </div>
</body>
</html>

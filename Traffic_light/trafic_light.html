<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .border{
            width: 245px;
            height: 680px;
            background-color: rgb(83, 69, 69);
            display: flex;
            border: 5px solid black;
        }
        #circle1{
            background-color: red;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            margin: 20px;;
            border: 5px solid black;
        }
        #circle2{
            background-color: yellow;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            margin: 20px;
            border: 5px solid black;
        }
        #circle3{
            background-color: green;
            height: 200px;
            width: 200px;
            border-radius: 50%;
            margin: 20px;
            border: 5px solid black;
        }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: center;">
        <div class="border">
            <div class="light">
                <div id="circle1"></div>
                <div id="circle2"></div>
                <div id="circle3"></div>
            </div>
        </div>
    </div>
</body>
</html>

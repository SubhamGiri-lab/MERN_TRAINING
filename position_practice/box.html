    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            position: relative;
            background-color: rgb(217, 155, 116);
        }
        .box{
            height: 201px;
            width: 201px;
            display: inline-block;
            border: 2px solid palevioletred;
            position: relative;
        }

            z-index: 1;

            top: 200px;
        }
        .box2{

            left: 100px;
        }

        .box6{
            position: absolute;

            top: 300px;
            z-index: 6;
        }
        .box7{
            z-index: 7;
            position: absolute;
            right: 100px;
            top: 197px;
            
        }
        .box8{
            z-index: 8;
            position: absolute;
            right: 197px;
            top: 100px;
        }
        .main{
            position: absolute;
            top: 10%;
            left: 24%;
        }
    </style>
</head>
<body>
